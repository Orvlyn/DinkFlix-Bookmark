name: Build Plugin

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build src/Jellyfin.Plugin.DinkFlixWatchLater/Jellyfin.Plugin.DinkFlixWatchLater.csproj -c Release -o publish

      - name: Package
        run: |
          mkdir -p package/DinkFlixWatchLater
          cp publish/Jellyfin.Plugin.DinkFlixWatchLater.dll package/DinkFlixWatchLater/
          cd package && zip -r ../DinkFlixWatchLater.zip DinkFlixWatchLater

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinkFlixWatchLater
          path: DinkFlixWatchLater.zip
