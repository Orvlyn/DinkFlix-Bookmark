name: Build and Publish Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dinkflix-watchlater-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.2.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Jellyfin.Plugin.DinkFlixWatchLater/Jellyfin.Plugin.DinkFlixWatchLater.csproj \
            --configuration Release \
            --output publish
          test -f publish/Jellyfin.Plugin.DinkFlixWatchLater.dll

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="DinkFlixWatchLater_${VERSION}.zip"
          rm -rf package
          mkdir package
          cp publish/Jellyfin.Plugin.DinkFlixWatchLater.dll package/
          (cd package && zip -q -r "../${ZIP_NAME}" .)
          test -s "${ZIP_NAME}"
          echo "zip=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${{ steps.package.outputs.zip }}"
          unzip -t "${ZIP_NAME}"
          unzip -l "${ZIP_NAME}" | grep -F "Jellyfin.Plugin.DinkFlixWatchLater.dll"
          echo "Package verified: ${ZIP_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${{ steps.package.outputs.zip }}"
          gh release create "${VERSION}" "${ZIP_NAME}" \
            --title "DinkFlix Watch Later ${VERSION}" \
            --notes "Automated DinkFlix Watch Later build for commit ${{ github.sha }}." \
            --latest

      - name: Commit manifest safely
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${{ steps.package.outputs.zip }}"
          CHECKSUM="$(md5sum "${ZIP_NAME}" | cut -d ' ' -f1)"
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ZIP_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # manifest.json is generated data. Never rebase a local generated commit
          # onto main: another source commit may have legitimately changed the
          # manifest, which creates an unnecessary merge conflict. Instead, always
          # start from the latest remote main, regenerate the manifest, and retry
          # from a fresh remote state if somebody wins the push race.
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Preparing manifest from the latest origin/main (attempt ${attempt})."
            git fetch --prune origin main
            git reset --hard origin/main

            TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            jq --arg version "$VERSION" \
               --arg sourceUrl "$SOURCE_URL" \
               --arg checksum "$CHECKSUM" \
               --arg timestamp "$TIMESTAMP" \
               '.[0].versions = ([{version:$version,changelog:"DinkFlix Watch Later 1.2 redesign",targetAbi:"12.0.0.0",sourceUrl:$sourceUrl,checksum:$checksum,timestamp:$timestamp}] + ([.[0].versions[]? | select(.version != $version)]))' \
               manifest.json > manifest.tmp.json
            mv manifest.tmp.json manifest.json

            if git diff --quiet -- manifest.json; then
              echo "Manifest already contains ${VERSION}; nothing to commit."
              exit 0
            fi

            git add manifest.json
            git commit -m "Update plugin manifest for ${VERSION} [skip ci]"

            if git push origin HEAD:main; then
              echo "Manifest pushed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} lost a race with another main-branch update. Discarding the generated commit and retrying from the newest origin/main."
          done

          echo "Unable to publish the manifest after 8 attempts."
          exit 1
