name: Build and Publish Plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: dinkflix-watchlater-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.1.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build
        run: dotnet build src/Jellyfin.Plugin.DinkFlixWatchLater/Jellyfin.Plugin.DinkFlixWatchLater.csproj -c Release -o publish
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="DinkFlixWatchLater_${VERSION}.zip"
          test -f publish/Jellyfin.Plugin.DinkFlixWatchLater.dll
          mkdir -p package
          cp publish/Jellyfin.Plugin.DinkFlixWatchLater.dll package/
          (cd package && zip -r "../${ZIP_NAME}" .)
          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
        id: package
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${{ steps.package.outputs.zip }}"
          test -n "$VERSION"
          test -f "$ZIP_NAME"
          gh release create "$VERSION" "$ZIP_NAME" --title "$VERSION" --notes "DinkFlix Watch Later automated build from ${{ github.sha }}" --latest
      - name: Update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${{ steps.package.outputs.zip }}"
          CHECKSUM=$(md5sum "$ZIP_NAME" | cut -d ' ' -f1)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ZIP_NAME}"
          jq --arg version "$VERSION" --arg sourceUrl "$SOURCE_URL" --arg checksum "$CHECKSUM" --arg timestamp "$TIMESTAMP" '
            (.[0].versions) |= ([{version:$version,changelog:"DinkFlix Watch Later update",targetAbi:"12.0.0.0",sourceUrl:$sourceUrl,checksum:$checksum,timestamp:$timestamp}] + .)
          ' manifest.json > manifest.tmp.json
          mv manifest.tmp.json manifest.json
      - name: Commit manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update plugin manifest for ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main
