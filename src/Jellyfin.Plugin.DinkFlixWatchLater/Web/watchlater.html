<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DinkFlix Watch Later</title><link rel="stylesheet" href="/DinkFlixWatchLater/web/watchlater.css"></head><body>
<main class="page"><header><span>DINKFLIX</span><h1>Watch Later</h1><p>Keep titles on the radar without requesting them.</p></header>
<section class="search"><form id="searchForm"><label for="search">Find something to save</label><div><input id="search" type="search" placeholder="Search movies and TV shows..."><button>Search</button></div></form><div id="results" class="results" hidden></div></section>
<nav id="tabs"><button class="active" data-cat="all">All</button><button data-cat="movie">Movies</button><button data-cat="tv">TV Shows</button><button data-cat="anime">Anime</button><button data-cat="recommendations">Recommendations</button></nav>
<div id="error" class="error" hidden></div><div id="loading" hidden>Loading...</div>
<section id="saved"><div class="heading"><div><small>YOUR LIST</small><h2 id="heading">Everything saved</h2></div><i id="count"></i></div><p id="empty">Nothing saved here yet. Search above to add your first title.</p><div id="grid" class="grid"></div></section>
<section id="recs" hidden><div class="heading"><div><small>FROM SEERR</small><h2>Because you saved these</h2></div></div><p id="recEmpty">Save a few titles and DinkFlix will use Seerr recommendations here.</p><div id="recGrid" class="grid"></div></section>
</main><script src="/DinkFlixWatchLater/web/watchlater.js"></script></body></html>
